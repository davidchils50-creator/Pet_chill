<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Chill</title>
    <meta name="description" content="Retro 16-bit Pixel Art Virtual Pet Game featuring an animated pixel cat, AI wander, jump, and interactive retro HUD." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="arcade-wrapper">
        <div class="canvas-container">
            <canvas id="gameCanvas" width="800" height="450"></canvas>
        </div>

        <!-- Arcade Control Deck for Mobile & Quick Interaction -->
        <div class="arcade-deck">
            <div class="dpad-container">
                <span class="control-tag">MOVE: ARROWS / WASD</span>
            </div>

            <div class="deck-actions">
                <button id="btnJump" class="arcade-btn btn-jump" title="Jump (A / Space / Z)">
                    <span class="btn-letter">A</span>
                    <span class="btn-label">JUMP</span>
                </button>
                <button id="btnAct" class="arcade-btn btn-act" title="Act / Meow (B / X / E)">
                    <span class="btn-letter">B</span>
                    <span class="btn-label">ACT</span>
                </button>
                <button id="btnSound" class="arcade-btn btn-audio" title="Toggle Sound / BGM (M)">
                    <span class="btn-letter">M</span>
                    <span class="btn-label" id="soundStatus">SOUND</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Main Game Script Entry -->
    <script type="module" src="/src/main.js"></script>
</body>
</html>
